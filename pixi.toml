[workspace]
channels = ["conda-forge"]
name = "AdventofCode"
platforms = ["linux-64", "win-64"]
version = "0.1.0"

[tasks]
lab = "jupyter lab"

[dependencies]
python = ">=3.14.3,<3.15"
jupyter = ">=1.1.1,<2"
jupyterlab = ">=4.5.4,<5"
numpy = ">=2.3.5,<3"
pandas = ">=3.0.0,<4"
holoviews = ">=1.22.1,<2"
numba = ">=0.63.1,<0.64"
matplotlib = ">=3.10.8,<4"
seaborn = ">=0.13.2,<0.14"
